<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python Runner in HTML</title>
    <!-- Link to PyScript CSS and JS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>
    <h1>My Python HTML Runner</h1>
    <py-script>
        print("Hello from Python running in HTML!")
        result = 5 + 5
        print(f"5 + 5 = {result}")
    </py-script>
</body>
</html>
